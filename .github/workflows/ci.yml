name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *" # daily: catches changes in the Metric API, which the per-bin endpoint does not promise to keep
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  live:
    # hits the real Metric API and a headless browser: run daily and on demand, not on every push
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:live
      - run: npm run test:ui
        env:
          CHROME: /usr/bin/google-chrome
      - run: npm run test:sql
